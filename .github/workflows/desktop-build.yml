name: Desktop Cross-Platform Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_draft:
        description: 'Publish as draft GitHub Release'
        required: false
        default: 'false'
        type: boolean

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-x64'
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: 'msi,nsis'
          - platform: 'macos-arm64'
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: 'dmg,app'
          - platform: 'linux-x64'
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: 'appimage,deb'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Run Existing Regression Test Suite
        run: npm test

      - name: Prepare Bundled Node.js Sidecar
        run: node desktop-runtime/scripts/prepare-runtime.js --target=${{ matrix.target }}

      - name: Build and Package Tauri Desktop Installers
        run: node desktop-runtime/scripts/build.js --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Compute Checksums
        shell: bash
        run: |
          mkdir -p artifacts
          cp -r desktop/target/${{ matrix.target }}/release/bundle/* artifacts/ 2>/dev/null || cp -r desktop/target/release/bundle/* artifacts/ 2>/dev/null || true
          cd artifacts
          find . -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" \) -exec sha256sum {} + > SHA256SUMS.txt || true
          cat SHA256SUMS.txt || true

      - name: Upload Desktop Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tavoryn-desktop-${{ matrix.platform }}
          path: |
            desktop/target/**/release/bundle/**/*.exe
            desktop/target/**/release/bundle/**/*.msi
            desktop/target/**/release/bundle/**/*.dmg
            desktop/target/**/release/bundle/**/*.AppImage
            desktop/target/**/release/bundle/**/*.deb
            artifacts/SHA256SUMS.txt

  publish-release:
    name: Publish Release Artifacts
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_draft == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Consolidate Checksums
        run: |
          cd release-artifacts
          find . -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" \) -exec sha256sum {} + | sort -k 2 > SHA256SUMS-ALL.txt
          cat SHA256SUMS-ALL.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event.inputs.release_draft == 'true' }}
          prerelease: false
          files: |
            release-artifacts/**/bundle/**/*.exe
            release-artifacts/**/bundle/**/*.msi
            release-artifacts/**/bundle/**/*.dmg
            release-artifacts/**/bundle/**/*.AppImage
            release-artifacts/**/bundle/**/*.deb
            release-artifacts/SHA256SUMS-ALL.txt
          generate_release_notes: true
