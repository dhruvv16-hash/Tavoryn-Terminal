<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tavoryn Terminal</title>
    <!-- Tavoryn Terminal engine -->
    <link rel="stylesheet" href="/css/terminal.css" />
    <link rel="stylesheet" href="/css/manual.css" />
    <link rel="stylesheet" href="/css/tour.css" />
    <link rel="stylesheet" href="/css/auth.css" />
    <link rel="stylesheet" href="/css/download-page.css?v=20261106b" />
    <link rel="stylesheet" href="/css/login-page.css?v=20261106b" />
    <script>
      try {
        if (window.location.pathname === "/download" || window.location.pathname === "/downloads" || window.location.pathname === "/desktop") {
          document.documentElement.classList.add("route-download");
        }
        if (localStorage.getItem("tavoryn:auth_user")) {
          document.documentElement.classList.add("authenticated");
        }
        if (localStorage.getItem("tavoryn:theme") === "light") {
          document.documentElement.classList.add("theme-light");
        }
      } catch (e) {}
    </script>
    <script src="/vendor/lightweight-charts.standalone.production.js"></script>
  </head>
  <body>
    <header class="top">
      <div class="brand" id="brandLogo" role="button" tabindex="0" title="Back to Terminal Workspace">
        <span class="logo">TAVORYN</span><span class="sub">TERMINAL</span>
      </div>
      <form id="globalCmd" class="gcmd" autocomplete="off">
        <input
          id="gInput"
          spellcheck="false"
          placeholder="Type a ticker or a function, then GO.  Try  WEI  ·  AAPL DES  ·  TOP  ·  GC  ·  HELP"
        />
        <button type="submit" class="go">GO</button>
      </form>
      <div id="clocks" class="clocks"></div>
      <button id="themeToggleBtn" class="toplink theme-toggle-btn" type="button" title="Toggle Light / Dark Mode">☀ LIGHT</button>
      <button id="tourBtn" class="toplink" type="button" title="Interactive Terminal Tour & Onboarding Walkthrough">TOUR</button>
      <button id="userBtn" class="toplink user-toplink" type="button" title="User Account & Security">SIGN IN</button>
      <div id="userProfilePopover" class="user-profile-popover" hidden></div>
      <a
        id="helpLink"
        class="toplink"
        href="/user-manual"
        title="Interactive User Manual & Help Center"
        >HELP</a
      >
      <button
        id="downloadTopBtn"
        class="toplink download-topbtn"
        type="button"
        title="Download Tavoryn Terminal Desktop for Windows, Mac & Linux"
        >⬇ DOWNLOAD</button
      >
      <div id="downloadPopover" class="download-popover" hidden></div>
    </header>
    <div class="keys" id="keys"></div>
    <main id="grid" class="grid"></main>
    <div id="manualView" class="manual-view" hidden></div>
    <div id="downloadView" class="download-view" hidden></div>
    <div id="authGate" class="auth-gate" hidden></div>
    <div id="recaptcha-container"></div>
    <div id="loginPageView" class="login-page"></div>
    <footer class="tape"><div id="tape" class="tape-run"></div></footer>
    <div id="suggest" class="suggest" hidden></div>
    <div id="toast" class="toast" hidden></div>
    <script type="module" src="/js/app.js?v=20261106b"></script>
  </body>
</html>
